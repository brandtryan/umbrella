<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Buffer-Centric Variable Font Reactor</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
			rel="stylesheet"
		/>
		<style>
			@property --wght {
				syntax: "<number>";
				inherits: false;
				initial-value: 300;
			}
			@property --wdth {
				syntax: "<number>";
				inherits: false;
				initial-value: 100;
			}

			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				background-color: #213547;
				color: #f1f1f1f5;
				font-family: "Inter", system-ui;
				overflow: hidden;
			}

			#app {
				height: 100vh;
				width: 100vw;
				display: flex;
				flex-direction: column;
				overflow-y: auto;
				scroll-snap-type: y mandatory;
				scroll-behavior: smooth;
			}

			section {
				height: 100vh;
				flex-shrink: 0;
				scroll-snap-align: start;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				gap: 10px;
			}

			/* =========================================
			   EXPERIMENT: THE SIMPLE BLOCK LINE
			   ========================================= */
			.word-line-simple {
				display: block; /* Standard block element, NOT a grid */
				width: 100%;
				max-width: 51ch;
				margin: 0 auto;
				font-size: clamp(10px, 4vw, 20px);
				text-align: center;
				white-space: pre; /* Crucial: respects the hardcoded spaces */
			}

			/* Remove the containment firewall for words in the simple line */
			.word-line-simple .jitter-word {
				display: inline-block;
				width: auto;
				contain: layout style; /* Dropped 'size' containment so it stretches */
			}

			/* =========================================
			   THE REST OF THE APP: THE ROOTED GRID LINES
			   ========================================= */
			.word-line {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				place-items: center;
				width: 100%;
				max-width: 51ch;
				margin: 0 auto;
				font-size: clamp(10px, 4vw, 20px);
			}

			.jitter-word {
				font-variation-settings:
					"wght" var(--wght),
					"wdth" var(--wdth);
				display: block;
				contain: layout size style; /* FULL FIREWALL */
				width: 100%;
				height: 1.5em;
				overflow: visible;
				white-space: nowrap;
				text-align: center;
				will-change: font-variation-settings;
			}

			#fps-counter {
				position: fixed;
				top: 10px;
				left: 10px;
				background: rgba(0, 0, 0, 0.8);
				padding: 10px;
				font-family: monospace;
				z-index: 100;
			}
		</style>
	</head>
	<body>
		<div id="fps-counter">FPS: 0</div>
		<canvas id="compute-canvas" style="display: none"></canvas>
		<div id="app"></div>

		<script>
			window.onload = () => {
				const appContainer = document.getElementById("app");
				const spanElements = [];

				const TOTAL_PAGES = 64;
				const LINES_PER_PAGE = 16;
				const WORDS_PER_LINE = 4;
				const WORDS_PER_PAGE = LINES_PER_PAGE * WORDS_PER_LINE;

				// 1. SETUP DOM
				for (let p = 0; p < TOTAL_PAGES; p++) {
					const section = document.createElement("section");
					for (let line = 0; line < LINES_PER_PAGE; line++) {
						const lineDiv = document.createElement("div");

						// EXPERIMENT: Isolate the very first line of the app
						const isFirstLine = p === 0 && line === 0;
						lineDiv.className = isFirstLine
							? "word-line-simple"
							: "word-line";

						for (let w = 0; w < WORDS_PER_LINE; w++) {
							const span = document.createElement("span");
							span.className = "jitter-word";

							// EXPERIMENT: Add the inline spaces back, but ONLY for the simple line
							if (isFirstLine) {
								span.innerText =
									"stochastic" +
									(w < WORDS_PER_LINE - 1 ? " " : "");
							} else {
								span.innerText = "stochastic";
							}

							lineDiv.appendChild(span);
							spanElements.push(span);
						}
						section.appendChild(lineDiv);
					}
					section.setAttribute("data-page-index", p);
					appContainer.appendChild(section);
				}

				const PARTICLE_COUNT = spanElements.length;

				// 1.5 INTERSECTION OBSERVER
				let activePageIndex = 0;
				const observer = new IntersectionObserver(
					(entries) => {
						entries.forEach((entry) => {
							if (entry.isIntersecting) {
								activePageIndex = parseInt(
									entry.target.getAttribute(
										"data-page-index",
									),
									10,
								);
							}
						});
					},
					{ root: appContainer, threshold: 0.5 },
				);

				document
					.querySelectorAll("section")
					.forEach((sec) => observer.observe(sec));

				// 2. WEBGL2 CONTEXT & SHADER SETUP
				const canvas = document.getElementById("compute-canvas");
				const gl = canvas.getContext("webgl2");
				if (!gl) return;

				const vsSource = `#version 300 es
			             in vec4 a_particleData; out vec4 v_newParticleData;
			             float rand(vec2 co){ return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453); }
			             void main() {
			                 float currentWght = a_particleData.x;
			                 float targetWght = a_particleData.y;
			                 float speed = a_particleData.z;
			                 float seed = a_particleData.w;
			                 float diff = targetWght - currentWght;
			                 currentWght += diff * speed;
			                 if (abs(diff) < 10.0) {
			                     targetWght = 100.0 + rand(vec2(seed, currentWght)) * 800.0;
			                     seed += 1.0;
			                 }
			                 v_newParticleData = vec4(currentWght, targetWght, speed, seed);
			             }
			         `;

				const fsSource = `#version 300 es\nprecision mediump float; out vec4 fragColor; void main() { fragColor = vec4(1.0); }`;

				function compileShader(type, source) {
					const shader = gl.createShader(type);
					gl.shaderSource(shader, source);
					gl.compileShader(shader);
					return shader;
				}

				const program = gl.createProgram();
				gl.attachShader(
					program,
					compileShader(gl.VERTEX_SHADER, vsSource),
				);
				gl.attachShader(
					program,
					compileShader(gl.FRAGMENT_SHADER, fsSource),
				);
				gl.transformFeedbackVaryings(
					program,
					["v_newParticleData"],
					gl.SEPARATE_ATTRIBS,
				);
				gl.linkProgram(program);
				gl.useProgram(program);

				// 3. BUFFER CREATION
				const initialData = new Float32Array(PARTICLE_COUNT * 4);
				for (let i = 0; i < PARTICLE_COUNT * 4; i += 4) {
					initialData[i] = 300.0;
					initialData[i + 1] = 900.0;
					initialData[i + 2] = 0.05 + Math.random() * 0.1;
					initialData[i + 3] = Math.random() * 100.0;
				}

				const bufferA = gl.createBuffer();
				gl.bindBuffer(gl.ARRAY_BUFFER, bufferA);
				gl.bufferData(gl.ARRAY_BUFFER, initialData, gl.DYNAMIC_COPY);
				const bufferB = gl.createBuffer();
				gl.bindBuffer(gl.ARRAY_BUFFER, bufferB);
				gl.bufferData(
					gl.ARRAY_BUFFER,
					initialData.byteLength,
					gl.DYNAMIC_COPY,
				);
				const pingPongBuffers = [bufferA, bufferB];
				let readIndex = 0;

				const dataLocation = gl.getAttribLocation(
					program,
					"a_particleData",
				);
				const vaoA = gl.createVertexArray();
				gl.bindVertexArray(vaoA);
				gl.bindBuffer(gl.ARRAY_BUFFER, bufferA);
				gl.enableVertexAttribArray(dataLocation);
				gl.vertexAttribPointer(dataLocation, 4, gl.FLOAT, false, 0, 0);
				const vaoB = gl.createVertexArray();
				gl.bindVertexArray(vaoB);
				gl.bindBuffer(gl.ARRAY_BUFFER, bufferB);
				gl.enableVertexAttribArray(dataLocation);
				gl.vertexAttribPointer(dataLocation, 4, gl.FLOAT, false, 0, 0);
				gl.bindVertexArray(null);

				const pbo = gl.createBuffer();
				gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo);
				gl.bufferData(
					gl.PIXEL_PACK_BUFFER,
					initialData.byteLength,
					gl.STREAM_READ,
				);
				gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);

				const resultData = new Float32Array(PARTICLE_COUNT * 4);
				const previousWeights = new Int32Array(PARTICLE_COUNT);
				let currentFence = null;

				let lastTime = performance.now();
				let frameCount = 0;
				const fpsEl = document.getElementById("fps-counter");

				// 4. THE REACTOR LOOP
				function renderLoop() {
					const now = performance.now();
					frameCount++;
					if (now - lastTime >= 1000) {
						fpsEl.innerText = `FPS: ${frameCount}`;
						frameCount = 0;
						lastTime = now;
					}

					const writeIndex = 1 - readIndex;
					const outputBuffer = pingPongBuffers[writeIndex];
					const activeVAO = readIndex === 0 ? vaoA : vaoB;

					gl.bindVertexArray(activeVAO);
					gl.bindBufferBase(
						gl.TRANSFORM_FEEDBACK_BUFFER,
						0,
						outputBuffer,
					);
					gl.bindBuffer(gl.ARRAY_BUFFER, null);

					gl.enable(gl.RASTERIZER_DISCARD);
					gl.beginTransformFeedback(gl.POINTS);
					gl.drawArrays(gl.POINTS, 0, PARTICLE_COUNT);
					gl.endTransformFeedback();
					gl.disable(gl.RASTERIZER_DISCARD);

					gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, null);

					if (currentFence) {
						const status = gl.clientWaitSync(currentFence, 0, 0);

						if (
							status === gl.ALREADY_SIGNALED ||
							status === gl.CONDITION_SATISFIED
						) {
							gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo);
							gl.getBufferSubData(
								gl.PIXEL_PACK_BUFFER,
								0,
								resultData,
							);
							gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
							gl.deleteSync(currentFence);
							currentFence = null;

							const startIndex = activePageIndex * WORDS_PER_PAGE;
							const endIndex = startIndex + WORDS_PER_PAGE;

							for (let i = startIndex; i < endIndex; i++) {
								if (i >= PARTICLE_COUNT) break;

								const dataIndex = i * 4;
								const currentWeight = Math.round(
									resultData[dataIndex],
								);

								if (currentWeight !== previousWeights[i]) {
									spanElements[i].style.setProperty(
										"--wght",
										currentWeight,
									);

									const stretchValue =
										50 +
										((currentWeight - 100) / 800) * 100;
									spanElements[i].style.setProperty(
										"--wdth",
										stretchValue,
									);

									previousWeights[i] = currentWeight;
								}
							}
						}
					}

					if (!currentFence) {
						gl.bindBuffer(gl.COPY_READ_BUFFER, outputBuffer);
						gl.bindBuffer(gl.COPY_WRITE_BUFFER, pbo);
						gl.copyBufferSubData(
							gl.COPY_READ_BUFFER,
							gl.COPY_WRITE_BUFFER,
							0,
							0,
							initialData.byteLength,
						);

						gl.bindBuffer(gl.COPY_READ_BUFFER, null);
						gl.bindBuffer(gl.COPY_WRITE_BUFFER, null);

						currentFence = gl.fenceSync(
							gl.SYNC_GPU_COMMANDS_COMPLETE,
							0,
						);
					}

					readIndex = writeIndex;
					requestAnimationFrame(renderLoop);
				}

				renderLoop();
			};
		</script>
	</body>
</html>
