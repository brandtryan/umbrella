<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Buffer-Centric Variable Font Reactor</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
			rel="stylesheet"
		/>
		<style>
			@property --wght {
				syntax: "<number>";
				inherits: false;
				initial-value: 300;
			}

			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				background-color: #213547;
				color: #f1f1f1f5;
				font-family: "Inter", system-ui;
				overflow: hidden;
			}

			#app {
				height: 100vh;
				width: 100vw;
				display: flex;
				flex-direction: column;
				overflow-y: auto;
				scroll-snap-type: y mandatory;
				scroll-behavior: smooth;
			}

			section {
				height: 100vh;
				flex-shrink: 0;
				scroll-snap-align: start;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				gap: 10px;
			}

			.word-line {
				display: block;
				white-space: pre;
				font-size: 20px;
				text-align: center;
			}

			.jitter-word {
				font-variation-settings: "wght" var(--wght);
				display: inline-block;
				contain: layout style;
				will-change: font-variation-settings;
			}

			#fps-counter {
				position: fixed;
				top: 10px;
				left: 10px;
				background: rgba(0, 0, 0, 0.8);
				padding: 10px;
				font-family: monospace;
				z-index: 100;
			}
		</style>
	</head>
	<body>
		<div id="fps-counter">FPS: 0</div>
		<canvas id="compute-canvas" style="display: none"></canvas>
		<div id="app"></div>

		<!-- type="module" allows ES imports and defers execution automatically (no window.onload needed) -->
		<script type="module">
			import { ECS } from "https://esm.run/@thi.ng/ecs";
			import { defAtom } from "https://esm.run/@thi.ng/atom";
			import {
				fromRAF,
				reactive,
				sync,
			} from "https://esm.run/@thi.ng/rstream";
			import { initGraph } from "https://esm.run/@thi.ng/rstream-graph";

			const appContainer = document.getElementById("app");
			const spanElements = [];

			const TOTAL_PAGES = 64;
			const LINES_PER_PAGE = 16;
			const WORDS_PER_LINE = 4;
			const WORDS_PER_PAGE = LINES_PER_PAGE * WORDS_PER_LINE;

			// ==========================================
			// 1. SETUP DOM (Vanilla)
			// ==========================================
			for (let p = 0; p < TOTAL_PAGES; p++) {
				const section = document.createElement("section");
				for (let line = 0; line < LINES_PER_PAGE; line++) {
					const lineDiv = document.createElement("div");
					lineDiv.className = "word-line";
					for (let w = 0; w < WORDS_PER_LINE; w++) {
						const span = document.createElement("span");
						span.className = "jitter-word";
						span.innerText =
							"stochastic" + (w < WORDS_PER_LINE - 1 ? " " : "");
						lineDiv.appendChild(span);
						spanElements.push(span);
					}
					section.appendChild(lineDiv);
				}
				appContainer.appendChild(section);
			}

			const PARTICLE_COUNT = spanElements.length; // Exactly 4096

			// ==========================================
			// 2. DATA LAYER (@thi.ng/ecs)
			// ==========================================
			const ecs = new ECS({ capacity: PARTICLE_COUNT });

			const stateComp = ecs.defComponent({
				id: "state",
				type: "f32",
				size: 4, // [currentWght, targetWght, speed, seed]
			});

			for (let i = 0; i < PARTICLE_COUNT; i++) {
				ecs.defEntity([stateComp.id]);
				const idx = i * 4;
				stateComp.vals[idx] = 300.0;
				stateComp.vals[idx + 1] = 900.0;
				stateComp.vals[idx + 2] = 0.05 + Math.random() * 0.1;
				stateComp.vals[idx + 3] = Math.random() * 100.0;
			}

			// ==========================================
			// 3. WEBGL2 CONTEXT & SHADER SETUP
			// ==========================================
			const canvas = document.getElementById("compute-canvas");
			const gl = canvas.getContext("webgl2");

			if (!gl) throw new Error("WebGL2 not supported");

			const vsSource = `#version 300 es
				in vec4 a_particleData; out vec4 v_newParticleData;
				float rand(vec2 co){ return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453); }
				void main() {
					float currentWght = a_particleData.x;
					float targetWght = a_particleData.y;
					float speed = a_particleData.z;
					float seed = a_particleData.w;
					float diff = targetWght - currentWght;
					currentWght += diff * speed;
					if (abs(diff) < 10.0) {
						targetWght = 100.0 + rand(vec2(seed, currentWght)) * 800.0;
						seed += 1.0;
					}
					v_newParticleData = vec4(currentWght, targetWght, speed, seed);
				}
			`;
			const fsSource = `#version 300 es\nprecision mediump float; out vec4 fragColor; void main() { fragColor = vec4(1.0); }`;

			function compileShader(type, source) {
				const shader = gl.createShader(type);
				gl.shaderSource(shader, source);
				gl.compileShader(shader);
				return shader;
			}

			const program = gl.createProgram();
			gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
			gl.attachShader(
				program,
				compileShader(gl.FRAGMENT_SHADER, fsSource),
			);
			gl.transformFeedbackVaryings(
				program,
				["v_newParticleData"],
				gl.SEPARATE_ATTRIBS,
			);
			gl.linkProgram(program);
			gl.useProgram(program);

			const bufferA = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, bufferA);
			gl.bufferData(gl.ARRAY_BUFFER, stateComp.vals, gl.DYNAMIC_COPY);
			const bufferB = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, bufferB);
			gl.bufferData(
				gl.ARRAY_BUFFER,
				stateComp.vals.byteLength,
				gl.DYNAMIC_COPY,
			);
			const pingPongBuffers = [bufferA, bufferB];

			const dataLocation = gl.getAttribLocation(
				program,
				"a_particleData",
			);
			const vaoA = gl.createVertexArray();
			gl.bindVertexArray(vaoA);
			gl.bindBuffer(gl.ARRAY_BUFFER, bufferA);
			gl.enableVertexAttribArray(dataLocation);
			gl.vertexAttribPointer(dataLocation, 4, gl.FLOAT, false, 0, 0);
			const vaoB = gl.createVertexArray();
			gl.bindVertexArray(vaoB);
			gl.bindBuffer(gl.ARRAY_BUFFER, bufferB);
			gl.enableVertexAttribArray(dataLocation);
			gl.vertexAttribPointer(dataLocation, 4, gl.FLOAT, false, 0, 0);
			gl.bindVertexArray(null);

			const pbo = gl.createBuffer();
			gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo);
			gl.bufferData(
				gl.PIXEL_PACK_BUFFER,
				stateComp.vals.byteLength,
				gl.STREAM_READ,
			);
			gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);

			let readIndex = 0;
			let currentFence = null;
			let lastTime = performance.now();
			let frameCount = 0;
			const fpsEl = document.getElementById("fps-counter");
			const previousWeights = new Int32Array(PARTICLE_COUNT);

			// ==========================================
			// 4. REACTIVE GRAPH LAYER (@thi.ng/rstream)
			// ==========================================

			// Setup base source streams
			const raf$ = fromRAF();
			const scroll$ = reactive(0);

			appContainer.addEventListener(
				"scroll",
				(e) => {
					scroll$.next(
						Math.round(e.target.scrollTop / window.innerHeight),
					);
				},
				{ passive: true },
			);

			const db = defAtom({});

			// The Dataflow Pipeline
			const graph = initGraph(db, {
				// Node 1: The GPU Coprocessor
				gpuNode: {
					fn: (inputs) =>
						inputs.raf.map((tick) => {
							frameCount++;
							if (tick >= lastTime + 1000) {
								fpsEl.innerText = `FPS: ${frameCount}`;
								frameCount = 0;
								lastTime = tick;
							}

							const writeIndex = 1 - readIndex;
							const outputBuffer = pingPongBuffers[writeIndex];
							const activeVAO = readIndex === 0 ? vaoA : vaoB;

							gl.bindVertexArray(activeVAO);
							gl.bindBufferBase(
								gl.TRANSFORM_FEEDBACK_BUFFER,
								0,
								outputBuffer,
							);
							gl.bindBuffer(gl.ARRAY_BUFFER, null);

							// Resolve Fence & Emit to ECS
							if (currentFence) {
								const status = gl.clientWaitSync(
									currentFence,
									0,
									0,
								);
								if (
									status === gl.ALREADY_SIGNALED ||
									status === gl.CONDITION_SATISFIED
								) {
									gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo);
									gl.getBufferSubData(
										gl.PIXEL_PACK_BUFFER,
										0,
										stateComp.vals,
									);
									gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
									gl.deleteSync(currentFence);
									currentFence = null;

									return stateComp.vals; // EMIT DATA!
								}
							}

							// Fire next compute cycle
							if (!currentFence) {
								gl.enable(gl.RASTERIZER_DISCARD);
								gl.beginTransformFeedback(gl.POINTS);
								gl.drawArrays(gl.POINTS, 0, PARTICLE_COUNT);
								gl.endTransformFeedback();
								gl.disable(gl.RASTERIZER_DISCARD);

								// CRITICAL WEBGL FIX: Unbind TF buffer before copying!
								gl.bindBufferBase(
									gl.TRANSFORM_FEEDBACK_BUFFER,
									0,
									null,
								);

								gl.bindBuffer(
									gl.COPY_READ_BUFFER,
									outputBuffer,
								);
								gl.bindBuffer(gl.COPY_WRITE_BUFFER, pbo);
								gl.copyBufferSubData(
									gl.COPY_READ_BUFFER,
									gl.COPY_WRITE_BUFFER,
									0,
									0,
									stateComp.vals.byteLength,
								);
								gl.bindBuffer(gl.COPY_READ_BUFFER, null);
								gl.bindBuffer(gl.COPY_WRITE_BUFFER, null);
								currentFence = gl.fenceSync(
									gl.SYNC_GPU_COMMANDS_COMPLETE,
									0,
								);
								readIndex = writeIndex;
							}

							return null;
						}),
					// FIX: Explicitly define the input stream so 'inputs.raf' is populated!
					ins: {
						raf: { stream: () => raf$ },
					},
				},

				// Node 2: The UI Sink
				uiNode: {
					fn: (inputs) =>
						sync({
							src: {
								ecsData: inputs.gpu,
								activePage: inputs.scroll,
							},
						}).subscribe({
							next: ({ ecsData, activePage }) => {
								if (!ecsData) return;

								const startIndex = activePage * WORDS_PER_PAGE;
								const endIndex = startIndex + WORDS_PER_PAGE;

								for (let i = startIndex; i < endIndex; i++) {
									if (i >= PARTICLE_COUNT) break;
									const weight = Math.round(ecsData[i * 4]);

									if (weight !== previousWeights[i]) {
										spanElements[i].style.setProperty(
											"--wght",
											weight,
										);
										previousWeights[i] = weight;
									}
								}
							},
						}),
					ins: {
						// FIX: Use the correct rstream-graph path resolution syntax!
						gpu: { stream: "/gpuNode/node" },
						scroll: { stream: () => scroll$ },
					},
				},
			});
		</script>
	</body>
</html>
